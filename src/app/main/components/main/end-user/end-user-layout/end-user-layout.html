<app-header></app-header>
<router-outlet></router-outlet>
<app-footer></app-footer>

<!-- Mobile-only: quick category menu (replaces floating WhatsApp on layout) -->
@if (categorySheetOpen) {
  <button
    type="button"
    class="category-sheet-backdrop d-lg-none"
    aria-label="Close categories"
    (click)="closeCategorySheet()"></button>
}

<div
  id="mobile-category-sheet"
  class="category-sheet d-lg-none"
  [class.category-sheet--open]="categorySheetOpen"
  role="dialog"
  aria-modal="true"
  aria-label="Shop categories">
  <div class="category-sheet__header">
    <span class="category-sheet__title">Browse</span>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeCategorySheet()"></button>
  </div>
  <div class="category-sheet__body">
    <button type="button" class="category-sheet__row category-sheet__row--all" (click)="goAllProducts()">
      <span class="category-sheet__thumb category-sheet__thumb--all" aria-hidden="true">
        <i class="ri ri-grid-fill"></i>
      </span>
      <span class="category-sheet__name">Full pantry</span>
    </button>
    @for (cat of categories; track cat.id) {
      <button type="button" class="category-sheet__row" (click)="openCategory(cat)">
        <img
          class="category-sheet__thumb duha-protect-asset"
          [src]="categoryIconSrc(cat)"
          [alt]="cat.name"
          loading="lazy"
          draggable="false"
          (error)="onCategoryIconError($event)" />
        <span class="category-sheet__name">{{ cat.name }}</span>
      </button>
    }
    @if (categories.length === 0) {
      <p class="text-muted small px-3 py-2 mb-0">Categories will appear here when available.</p>
    }
  </div>
</div>

<button
  type="button"
  class="mobile-category-fab d-lg-none"
  [class.mobile-category-fab--open]="categorySheetOpen"
  [attr.aria-expanded]="categorySheetOpen"
  aria-controls="mobile-category-sheet"
  (click)="categorySheetOpen = !categorySheetOpen"
  aria-label="Browse shop categories">
  @if (categorySheetOpen) {
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
    <span class="mobile-category-fab__label">Close</span>
  } @else {
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/></svg>
    <span class="mobile-category-fab__label">Menu</span>
  }
</button>
