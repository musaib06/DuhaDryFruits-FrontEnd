<div class="auth-shell">
  <aside class="auth-brand">
    <div class="auth-brand__inner">
      <span class="auth-brand__logo">Duha<span class="auth-brand__accent">Dryfruits</span></span>
      <span class="auth-brand__tag">Premium Dry Fruits &amp; Nuts</span>
      <h2 class="auth-brand__headline">Let's get you<br />back in.</h2>
      <ul class="auth-brand__points">
        <li><i class="bi bi-envelope-check"></i> Reset link sent to your email</li>
        <li><i class="bi bi-shield-lock"></i> Your account stays secure</li>
      </ul>
    </div>
  </aside>

  <main class="auth-form-side">
    <div class="auth-container">
      <div class="auth-card">
        <h2 class="title">Forgot password</h2>
        <p class="subtitle">Enter your email and we'll send you a reset link</p>
        <form [formGroup]="viewModel.forgotForm" (ngSubmit)="onSubmit()">
          <div class="form-group">
            <label for="email">Email</label>
            <input id="email" formControlName="email" type="email" placeholder="Enter your email" />
          </div>

          <button type="submit" class="auth-btn" [disabled]="viewModel.forgotForm.invalid">Send Reset Link</button>
        </form>
      </div>
    </div>
  </main>
</div>
